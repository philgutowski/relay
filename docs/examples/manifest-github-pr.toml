# Relay manifest: a GitHub Projects board where each task ends at an open pull request whose
# checks have decided. The task process runs the whole shipping pipeline; the runner's only git
# write is checking out and syncing the default branch afterwards.

[project]
repo = "~/code/example-service"
default_branch = "main"
mirror = []

[tracker]
adapter = "github"
owner = "example-org"
project_number = 7
# An issue is terminal when it is CLOSED, or when its item on the board reads this status.
status_field = "Done"

[shipping]
mode = "pr_terminal"

[permissions]
allowed = ["Bash", "Read", "Edit", "Write", "Grep", "Glob", "Skill", "Agent", "TodoWrite"]
disallowed = []

[timeouts]
task_minutes = 150
closeout_minutes = 20
# How long the runner waits for the pull request's checks to decide before it halts.
ci_poll_minutes = 45

[closeout]
model = "sonnet"
effort = "medium"
allowed_tools = []
allowed_paths = []

[gate]
command = ["make", "check"]
description = "make check locally, and the same suite again in the pull request's CI"

[qualifying]
gate = "CI runs make check on every pull request and branch protection blocks a merge without it."
durable_state = "Merged pull requests and the board's issues are the only state carried between tasks."
independence = "The listed issues touch separate services and can ship in any order."
editors = "Only the repository's own maintainers can edit these issues or comment on them."

[on_blocked]
merge_partial = false
open_followup = true

[[tasks]]
id = "412"
model = "opus"
effort = "high"

[[tasks]]
id = "413"
model = "sonnet"
effort = "medium"
